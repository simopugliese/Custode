# Lint + test ad ogni push e su ogni PR (ARCHITECTURE.md §10).
# Il deploy sul Pi si innesterà qui quando esisterà il tunnel: parte solo se
# questa pipeline è verde.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipi, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Installa le dipendenze bloccate
        # --all-extras: i test coprono anche il bot, che ha python-telegram-bot
        # in un extra per non appesantire l'immagine dell'API.
        run: uv sync --frozen --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  immagini:
    # I test girano dai sorgenti e non hanno mai visto un'immagine costruita:
    # è il motivo per cui tre difetti del Dockerfile (README fuori dal contesto
    # di build, curl mancante, librerie condivise non copiate) sono arrivati
    # fino al Pi. Qui ogni target viene costruito e poi *avviato*, perché
    # costruire dimostra solo che i layer si applicano — non che il servizio
    # abbia davvero le dipendenze che importa.
    name: Immagini Docker (build + import)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            modulo: custode_api.main
          - target: bot
            modulo: custode_bot.main
          - target: worker
            modulo: custode_worker.main
          - target: whisper
            modulo: custode_whisper.main
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Costruisci ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: custode-${{ matrix.target }}:ci
          # Il target whisper compila whisper.cpp e scarica il modello: senza
          # cache ogni giro ripagherebbe quei minuti da capo.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: L'immagine importa il suo modulo
        # Il controllo che conta: ogni target installa solo i propri extra, e
        # un import che nell'ambiente di sviluppo (dove ci sono tutti) funziona
        # può mancare qui. Vale in particolare per `worker`, che usa
        # `custode_bot.risposte` senza installare python-telegram-bot.
        run: docker run --rm custode-${{ matrix.target }}:ci python -c "import ${{ matrix.modulo }}"

  dashboard:
    name: Dashboard (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
