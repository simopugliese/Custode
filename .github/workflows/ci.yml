# Lint + test ad ogni push e su ogni PR (ARCHITECTURE.md §10).
# Il job `deploy` in fondo aggiorna il Pi e poi pubblica la dashboard, e parte
# solo su un push a `main` con **tutti** gli altri job verdi (DEPLOY.md §6).
name: CI

on:
  # Solo `main`, non «tutti i branch». Con `branches: ["**"]` ogni push su un
  # branch con una PR aperta faceva partire **due run identiche** — una per il
  # push e una per la PR, sullo stesso commit. Non era solo il doppio del
  # lavoro: due job gemelli scrivono lo stesso `scope` della cache nello stesso
  # istante, e uno dei due muore in `exporting to GitHub Actions Cache: error
  # writing layer blob: not_found` — una build andata a buon fine segnata
  # rossa. È successo sul commit 2d75017, verde come push e rosso come PR.
  #
  # Le PR restano coperte da `pull_request`, che scatta anche ad ogni push
  # successivo (`synchronize`). Scoperto resta solo un push su un branch senza
  # PR aperta: lì la CI parte quando la PR si apre.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Su `main` mai: un push nuovo non deve interrompere a metà un deploy in corso
  # sul Pi (la run vecchia smetterebbe di aspettarne l'esito e di pubblicare la
  # dashboard). Le run in coda si sostituiscono da sole, resta solo l'ultima.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (lint, tipi, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Installa le dipendenze bloccate
        # --all-extras: i test coprono anche il bot, che ha python-telegram-bot
        # in un extra per non appesantire l'immagine dell'API.
        run: uv sync --frozen --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  immagini:
    # I test girano dai sorgenti e non hanno mai visto un'immagine costruita:
    # è il motivo per cui tre difetti del Dockerfile (README fuori dal contesto
    # di build, curl mancante, librerie condivise non copiate) sono arrivati
    # fino al Pi. Qui ogni target viene costruito e poi *avviato*, perché
    # costruire dimostra solo che i layer si applicano — non che il servizio
    # abbia davvero le dipendenze che importa.
    name: Immagini Docker (build + import)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cache`: quanto di ogni build si conserva. `max` salva anche i
          # layer intermedi di ogni stage, `min` solo quelli dell'immagine
          # finale. Non è gratis — misurato sul target api, l'export della
          # cache ha preso 15,5s contro 12s di build vera — e conviene solo
          # dove gli stage intermedi costano più di quanto costa conservarli.
          - target: api
            modulo: custode_api.main
            cache: min
          - target: bot
            modulo: custode_bot.main
            cache: min
          - target: worker
            modulo: custode_worker.main
            cache: min
          # Whisper è l'unico che merita `max`: dietro c'è `whisper-build`, che
          # compila whisper.cpp da sorgente e scarica il modello. Perdere
          # quello stage intermedio vuol dire tre minuti invece di uno.
          - target: whisper
            modulo: custode_whisper.main
            cache: max
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Costruisci ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: custode-${{ matrix.target }}:ci
          # Il target whisper compila whisper.cpp e scarica il modello: senza
          # cache ogni giro ripagherebbe quei minuti da capo. Il modo lo decide
          # la matrice, target per target — vedi lì il perché.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=${{ matrix.cache }},scope=${{ matrix.target }}

      - name: L'immagine importa il suo modulo
        # Il controllo che conta: ogni target installa solo i propri extra, e
        # un import che nell'ambiente di sviluppo (dove ci sono tutti) funziona
        # può mancare qui. Vale in particolare per `worker`, che usa
        # `custode_bot.risposte` senza installare python-telegram-bot.
        run: docker run --rm custode-${{ matrix.target }}:ci python -c "import ${{ matrix.modulo }}"

  dashboard:
    name: Dashboard (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    # Il nome conta: `custode_deploy/ci.py` lo esclude dai controlli che il Pi
    # chiede a GitHub, perché al momento della domanda è lui, in corso.
    name: Deploy
    needs: [backend, immagini, dashboard]
    # Mai su una PR, mai su un branch: solo ciò che è arrivato su `main`. Con un
    # `needs` rosso il job viene saltato, e con lui tutto quello che segue.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      URL: https://deploycustode.simonepugliese.com
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DEPLOY_HMAC_SECRET: ${{ secrets.DEPLOY_HMAC_SECRET }}
    steps:
      - name: Aggiorna il Pi e aspetta l'esito
        run: |
          set -euo pipefail

          # Una richiesta al listener del Pi: Cloudflare Access la lascia
          # passare col service token, il listener controlla la firma. Il
          # messaggio firmato è lo stesso di `custode_deploy/firma.py`:
          #   timestamp \n METODO \n percorso \n corpo
          chiama() {
            local metodo=$1 percorso=$2 corpo=${3:-} ts firma
            ts=$(date +%s)
            firma=$(printf '%s\n%s\n%s\n%s' "$ts" "$metodo" "$percorso" "$corpo" \
              | openssl dgst -sha256 -hmac "$DEPLOY_HMAC_SECRET" -hex | awk '{print $NF}')
            local args=(-fsS --max-time 30 -X "$metodo"
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
              -H "X-Custode-Timestamp: $ts" -H "X-Custode-Firma: $firma")
            if [ -n "$corpo" ]; then
              args+=(-H "Content-Type: application/json" --data "$corpo")
            fi
            curl "${args[@]}" "$URL$percorso"
          }

          id=$(chiama POST /deploy '{}' | jq -r .id)
          echo "Deploy in coda sul Pi: $id"

          fine=$((SECONDS + 1500))
          errori=0
          while :; do
            sleep 10
            if risposta=$(chiama GET "/stato/$id"); then
              errori=0
              stato=$(jq -r .stato <<<"$risposta")
              messaggio=$(jq -r .messaggio <<<"$risposta")
              echo "[$stato] $messaggio"
              case "$stato" in
                in_coda | in_corso) ;;
                ok) break ;;
                *)
                  echo "::error::Deploy sul Pi non riuscito ($stato): $messaggio"
                  exit 1
                  ;;
              esac
            else
              # Un singolo singhiozzo di rete non è un deploy fallito; cinque di fila sì.
              errori=$((errori + 1))
              echo "Il Pi non risponde ($errori/5)"
              [ "$errori" -lt 5 ] || { echo "::error::Il Pi non risponde"; exit 1; }
            fi
            [ "$SECONDS" -lt "$fine" ] || { echo "::error::Il deploy non è finito in 25 minuti"; exit 1; }
          done

      - name: Pubblica la dashboard
        # Solo se il Pi è su e risponde: la dashboard parla con l'API nuova.
        # L'hook costruisce l'ultimo commit di `main` con lo stesso `npm run
        # build` già verde sopra; qui si conferma che Pages ha accettato.
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: curl -fsS --max-time 30 -X POST "$PAGES_DEPLOY_HOOK"
