[project]
name = "custode"
version = "0.1.0"
description = "Custode — assistente personale (bot Telegram + API) self-hosted su Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    # I nomi dei fusi orari non sono garantiti nelle immagini slim: portarseli
    # dietro evita che ZoneInfo("Europe/Rome") fallisca solo in container.
    "tzdata==2024.2",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
# Serve solo al servizio `bot`: l'immagine dell'API non se lo porta dietro.
bot = [
    "python-telegram-bot==22.8",
]
router = [
    "anthropic==1.2.0",
    "httpx==0.28.1",
]
whisper = [
    "python-multipart==0.0.32",
]
# Il worker manda i suoi messaggi su Telegram con una sola chiamata HTTP
# (`custode_worker.telegram`), quindi gli basta httpx: `python-telegram-bot`
# resta fuori dalla sua immagine.
worker = [
    "httpx==0.28.1",
]

[dependency-groups]
# Strumenti di sviluppo/CI: lint, type check, test. Non finiscono nell'immagine
# di runtime (vedi lo stage `test` in api/Dockerfile).
dev = [
    "httpx==0.28.1",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Le cartelle sono quelle di ARCHITECTURE.md §5; dentro ognuna vive un pacchetto
# Python con prefisso `custode_` per avere import non ambigui. Qui compaiono solo
# i pacchetti che esistono davvero (vedi il README di ciascuna cartella).
[tool.hatch.build.targets.wheel]
packages = [
    "core/custode_core",
    "api/custode_api",
    "bot/custode_bot",
    "router/custode_router",
    "whisper/custode_whisper",
    "worker/custode_worker",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: test che esercitano l'API completa contro un DB reale su disco",
]
filterwarnings = [
    # I segnaposto numerati di sqlite3 (`?1`) mescolati a una sequenza sono
    # deprecati e in Python 3.14 diventano un errore. Farli fallire già adesso
    # costa niente ed evita di scoprirlo con un aggiornamento di Python.
    "error:.*named parameter.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "api", "bot", "router", "whisper", "worker", "tests"]

[tool.ruff.lint.isort]
# Senza questo isort tratterebbe i pacchetti del repo come librerie di terze
# parti e li mescolerebbe con fastapi/pydantic.
known-first-party = [
    "custode_core",
    "custode_api",
    "custode_bot",
    "custode_router",
    "custode_whisper",
    "custode_worker",
]

# `telegram.ext.Application` è generica su sei parametri che python-telegram-bot
# stesso lascia impliciti nei propri esempi: scriverli per esteso ovunque
# renderebbe le firme illeggibili senza guadagnare nulla in sicurezza.
[[tool.mypy.overrides]]
module = [
    "custode_bot.applicazione",
    "tests.unit.test_bot_whitelist",
    "tests.integration.test_bot_end_to_end",
]
disallow_any_generics = false
