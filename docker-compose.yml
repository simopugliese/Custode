# Custode — stack di esecuzione sul Raspberry Pi 5 (ARCHITECTURE.md §4).
#
# Un servizio per componente, cloudflared compreso.
# Nessuna porta è pubblicata verso l'esterno: da fuori si passa da Cloudflare
# Tunnel, che apre una connessione in uscita dal Pi (§2, §9).

x-comune: &comune
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    CUSTODE_DB_PATH: /data/custode.db
  volumes:
    # Bot e API scrivono sullo stesso file SQLite: SQLite è in modalità WAL e
    # con `busy_timeout`, che è esattamente il caso per cui servono (§3).
    - custode-data:/data

services:
  api:
    <<: *comune
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: custode-api:0.1.0
    container_name: custode-api
    ports:
      # Solo loopback: raggiungibile dal Pi (e dal tunnel, che gira lì),
      # invisibile al resto della rete di casa.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health').read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bot:
    <<: *comune
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: custode-bot:0.1.0
    container_name: custode-bot
    # Il bot legge TELEGRAM_BOT_TOKEN e TELEGRAM_ALLOWED_USER_ID dal .env:
    # senza, si ferma subito dicendo cosa manca invece di restare in ascolto
    # con la whitelist vuota.
    #
    # Nessun `depends_on` sull'api: il bot parla direttamente al database, e
    # legarlo alla salute dell'API vorrebbe dire perdere il canale principale
    # (§8.1) proprio quando qualcosa non va nel canale secondario. Le migrazioni
    # concorrenti sono gestite dal lock del runner, non dall'ordine di avvio.
    # Lo stesso vale per whisper: se la trascrizione è giù, i comandi e il testo
    # scritto devono continuare a funzionare.

  worker:
    <<: *comune
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: custode-worker:0.1.0
    container_name: custode-worker
    # Nessuna porta e nessun `depends_on`: il worker legge lo stesso file SQLite
    # e chiama Telegram da sé. Se l'API è giù il riepilogo settimanale parte lo
    # stesso, ed è giusto così — sono due cose indipendenti.
    volumes:
      - custode-data:/data
      # Il backup del DB (§9) esce dal volume Docker e finisce su un percorso
      # dell'host: §13 dice «sul secondo disco già presente sul Pi». Il default
      # `./backup` sta sulla stessa scheda del database — va bene per provare,
      # ma non protegge dal guasto che conta. Punta CUSTODE_BACKUP_HOST al
      # secondo disco (es. /mnt/backup) prima di fidartene.
      - ${CUSTODE_BACKUP_HOST:-./backup}:/backup

  whisper:
    build:
      context: .
      dockerfile: Dockerfile
      target: whisper
    image: custode-whisper:0.1.0
    container_name: custode-whisper
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Nessuna porta pubblicata: ci parla solo il bot, sulla rete interna.
    # Il limite di CPU è il motivo per cui whisper sta in un container suo:
    # una trascrizione lunga non deve rallentare le risposte del bot (§13).
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health').read()",
        ]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

  cloudflared:
    # Il tunnel (§2, §9): apre una connessione **in uscita** verso Cloudflare, quindi
    # sul router non si apre nessuna porta. Parla con l'API sulla rete interna di
    # Compose (`http://api:8000`, configurato nell'hostname pubblico del tunnel, non
    # qui): la pubblicazione su 127.0.0.1 dell'api non c'entra e resta com'è.
    #
    # Versione pinnata, mai `latest` (§9). Se il tag non esiste più su
    # https://github.com/cloudflare/cloudflared/releases, alzalo.
    image: cloudflare/cloudflared:2026.10.4
    container_name: custode-cloudflared
    restart: unless-stopped
    # Sta dietro un profilo: senza token non c'è tunnel da far partire, e un
    # `docker compose up` in locale (o sul Pi prima del §4 di DEPLOY.md) non deve
    # lasciare un container che si riavvia all'infinito. Si attiva con
    # `COMPOSE_PROFILES=tunnel` nel .env, così ogni `up` lo include da sé.
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    # Come gli altri: Compose non deve esporre nulla del tunnel verso la LAN.
    # Nessuna porta pubblicata, nessun volume.

volumes:
  # Il database vive qui: è l'unica cosa da backuppare (§3, §9).
  custode-data:
    name: custode-data
